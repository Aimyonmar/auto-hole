# auto-hole 内置指纹库（recon.engine v1）
#
# 结构说明：
#   id            规则唯一标识
#   product       归一化产品名（尽量对齐补天通用收录产品表）
#   confidence    命中置信度（0~1），最终低于 fingerprint.min_confidence 会被丢弃
#   logic         any：任一条件成立；all：全部条件成立
#   min_matched   any 逻辑下，命中条件数低于该值时按 weak_match_penalty 降权（抑制误报）
#   match         条件列表，类型：header / title / body / url / status / favicon
#   negative      排除条件，命中即否决该规则
#   template_dirs 命中后建议定向的 nuclei 模板目录（分级调度用）
#
# 维护约定：
#   - 只收录有明确、稳定页面特征的指纹；不写无依据的 hash
#   - 单一过泛的关键词（如 "wps"、"admin"）必须配 min_matched ≥ 2 或加 negative
meta:
  name: auto-hole builtin fingerprints
  version: 1
  updated: 2026-11-02

